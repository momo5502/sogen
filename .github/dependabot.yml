version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 100
    ignore:
      # Mbed TLS 4.x no longer commits its generated sources, so building it needs Perl and Jinja2.
      - dependency-name: "deps/mbedtls"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 100

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 100

  - package-ecosystem: "npm"
    directory: "/page"
    schedule:
      interval: monthly
    open-pull-requests-limit: 100
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (peer range <6.1.0).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/src/backends/icicle-emulator/icicle-bridge/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 100
